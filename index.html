<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Para mi Carmen hermosa</title>
    <!-- Cargamos las librerías 3D oficiales de forma segura -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 1. PANTALLA DE INICIO */
        #welcome-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .mew-container {
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }
        /* Silueta e iluminación suave para Mew */
        .mew-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(255, 182, 193, 0.7));
        }
        #btn-iniciar {
            padding: 15px 40px;
            font-size: 16px;
            letter-spacing: 4px;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(255,182,193,0.2), rgba(147,112,219,0.2));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
            transition: all 0.5s ease;
        }
        #btn-iniciar:active, #btn-iniciar:hover {
            background: linear-gradient(135deg, rgba(255,182,193,0.4), rgba(147,112,219,0.4));
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 30px rgba(255, 182, 193, 0.4);
            transform: scale(1.05);
        }

        /* 2. INTERFAZ DE LA GALAXIA (UI SUPERPUESTA) */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            opacity: 0;
            transition: opacity 3s ease 2s;
        }
        .main-title {
            text-align: center;
            color: #ffffff;
            font-weight: 300;
            font-size: 24px;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(255, 192, 203, 0.8), 0 0 40px rgba(147, 112, 219, 0.5);
            animation: pulseGlow 4s ease-in-out infinite;
        }
        .instructions {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ANIMACIONES CSS */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
            50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(255, 182, 193, 0.8)); }
        }
    </style>
</head>
<body>

    <!-- Canvas principal para los gráficos 3D -->
    <canvas id="universe-canvas"></canvas>

    <!-- Pantalla de Bienvenida con Mew de Pokémon -->
    <div id="welcome-screen">
        <div class="mew-container">
            <!-- Vector geométrico detallado y tierno de Mew -->
            <svg class="mew-svg" viewBox="0 0 120 120" fill="none" xmlns="http://w3.org">
                <!-- Oreja Izquierda -->
                <path d="M42 38C32 30 24 40 30 52C32 55 38 50 42 38Z" fill="#FFC0CB"/>
                <path d="M40 40C34 34 28 42 33 49C34 51 38 48 40 40Z" fill="#FFAEB9"/>
                <!-- Oreja Derecha -->
                <path d="M78 38C88 30 96 40 90 52C88 55 82 50 78 38Z" fill="#FFC0CB"/>
                <path d="M80 40C86 34 92 42 87 49C86 51 82 48 80 40Z" fill="#FFAEB9"/>
                <!-- Cabeza -->
                <path d="M60 32C42 32 34 46 36 62C38 78 48 84 60 84C72 84 82 78 84 62C86 46 78 32 60 32Z" fill="#FFC0CB"/>
                <!-- Ojo Izquierdo -->
                <ellipse cx="48" cy="56" rx="5" ry="8" fill="#4682B4"/>
                <ellipse cx="49" cy="53" rx="2" ry="3.5" fill="white"/>
                <!-- Ojo Derecho -->
                <ellipse cx="72" cy="56" rx="5" ry="8" fill="#4682B4"/>
                <ellipse cx="73" cy="53" rx="2" ry="3.5" fill="white"/>
                <!-- Hocico / Sonrisa sutil -->
                <path d="M57 66C57 66 60 63 63 66" stroke="#FF82AB" stroke-width="2" stroke-linecap="round"/>
                <!-- Cuerpo y patitas tiernas en la base -->
                <path d="M60 84C52 84 46 92 44 100C52 104 68 104 76 100C74 92 68 84 60 84Z" fill="#FFC0CB"/>
                <ellipse cx="46" cy="100" rx="4" ry="2" fill="#FFAEB9"/>
                <ellipse cx="74" cy="100" rx="4" ry="2" fill="#FFAEB9"/>
            </svg>
        </div>
        <button id="btn-iniciar">INICIAR</button>
    </div>

    <!-- Capa de texto para la Galaxia -->
    <div id="ui-layer">
        <h1 class="main-title">TE AMO CARMEN</h1>
        <div class="instructions">Arrastra o haz zoom para explorar tu universo</div>
    </div>

    <!-- Sistema de Audio Ambiental -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://google.com" type="audio/ogg">
    </audio>

    <script>
        // --- BASE DE DATOS LÍRICA Y CONCEPTUAL ---
        const frases = [
            "Eres mi hogar", "Eres mi mundo", "Te amo", "Te quiero", "Eres todo para mí",
            "Mi lugar favorito eres tú", "Siempre tú", "Mi persona favorita", "Contigo, siempre", "Eres mi paz",
            "Eres mi felicidad", "Tú y yo", "Mi lugar seguro", "Gracias por existir", "Te elegiría otra vez",
            "Eres mi universo", "Mi corazón es tuyo", "Quiero una vida contigo", "Eres mi casualidad favorita", "Mi amor por ti no tiene límites",
            "Eres mi estrella favorita", "Tú haces bonito mi mundo", "Me haces feliz", "Siempre voy a elegirte", "Eres mi sueño",
            "Te pienso siempre", "Eres especial para mí", "Mi corazón te pertenece", "Eres mi luz", "Quiero estar contigo",
            "Eres mi todo", "Mi amor", "Mi niña hermosa", "Tú eres suficiente", "Nunca olvides cuánto te amo",
            "Gracias por llegar a mi vida", "Contigo todo es mejor", "Eres mi universo entero", "Te amo más cada día", "Para siempre contigo"
        ];

        const conceptosPlanetas = [
            "AMOR", "CONFIANZA", "COMUNICACIÓN", "RESPETO", "LEALTAD",
            "BONDAD", "PACIENCIA", "COMPLICIDAD", "APOYO", "FELICIDAD"
        ];

        const coloresGalaxia = {
            fondo: 0x000000,
            violeta: 0x480ca8,
            rosaSutil: 0xf72585,
            oroEstrella: 0xffd700
        };

        let scene, camera, renderer, controls;
        let particulasGalaxia, solCorazon;
        let planetas = [];
        let mixFrasesTexto = [];
        let enTransicion = false;
        let tiempoGalaxia = 0;

        const canvas = document.getElementById('universe-canvas');
        const btnIniciar = document.getElementById('btn-iniciar');
        const welcomeScreen = document.getElementById('welcome-screen');
        const uiLayer = document.getElementById('ui-layer');
        const bgMusic = document.getElementById('bg-music');

        // --- MOTOR TRIDIMENSIONAL PRINCIPAL ---
        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(coloresGalaxia.fondo, 0.0015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 15);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;

            // Configuración de controles táctiles e inercia espacial
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 300;
            controls.minDistance = 15;
            controls.enabled = false; // Desactivado durante la introducción cinemática

            const luzAmbiente = new THREE.AmbientLight(0x444444);
            scene.add(luzAmbiente);

            const luzCentral = new THREE.PointLight(0xffb6c1, 2, 200);
            scene.add(luzCentral);

            // Generación de elementos cósmicos
            crearGalaxiaPolvo();
            crearSolCorazon();
crearPlanetasRelacion();crearConstelacionesFrases();window.addEventListener('resize', onWindowResize);btnIniciar.addEventListener('click', comenzarExperiencia);animate();}// --- SISTEMAS DE PARTÍCULAS Y ENTORNO ---function crearGalaxiaPolvo() {const numeroParticulas = 35000;const geometria = new THREE.BufferGeometry();const posiciones = new Float32Array(numeroParticulas * 3);const colores = new Float32Array(numeroParticulas * 3);const colorRosa = new THREE.Color(coloresGalaxia.rosaSutil);const colorVioleta = new THREE.Color(coloresGalaxia.violeta);const colorOro = new THREE.Color(coloresGalaxia.oroEstrella);for (let i = 0; i < numeroParticulas; i++) {const brazo = i % 3;const distanciaCentro = Math.pow(Math.random(), 2.5) * 160 + 4;const anguloEspiral = distanciaCentro * 0.18 + (brazo * ((2 * Math.PI) / 3));const x = Math.cos(anguloEspiral) * distanciaCentro + (Math.random() - 0.5) * (distanciaCentro * 0.2);const y = (Math.random() - 0.5) * 6;const z = Math.sin(anguloEspiral) * distanciaCentro + (Math.random() - 0.5) * (distanciaCentro * 0.2);posiciones[i * 3] = x;posiciones[i * 3 + 1] = y;posiciones[i * 3 + 2] = z;let colorMezclado = colorVioleta.clone();if (distanciaCentro < 40) {colorMezclado.lerp(colorRosa, distanciaCentro / 40);} else {colorMezclado.lerp(colorOro, (distanciaCentro - 40) / 120);}colores[i * 3] = colorMezclado.r;colores[i * 3 + 1] = colorMezclado.g;colores[i * 3 + 2] = colorMezclado.b;}geometria.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));geometria.setAttribute('color', new THREE.BufferAttribute(colores, 3));const canvasTextura = document.createElement('canvas');canvasTextura.width = 16;canvasTextura.height = 16;const ctx = canvasTextura.getContext('2d');const gradiente = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);gradiente.addColorStop(0, 'rgba(255,255,255,1)');gradiente.addColorStop(1, 'rgba(255,255,255,0)');ctx.fillStyle = gradiente;ctx.fillRect(0, 0, 16, 16);const material = new THREE.PointsMaterial({size: 1.0,map: new THREE.CanvasTexture(canvasTextura),vertexColors: true,blending: THREE.AdditiveBlending,transparent: true,depthWrite: false});particulasGalaxia = new THREE.Points(geometria, material);scene.add(particulasGalaxia);}function crearSolCorazon() {const formaCorazon = new THREE.Shape();formaCorazon.moveTo(5, 5);formaCorazon.bezierCurveTo(5, 5, 4, 0, 0, 0);formaCorazon.bezierCurveTo(-6, 0, -6, 7, -6, 7);formaCorazon.bezierCurveTo(-6, 11, -3, 15.4, 5, 19);formaCorazon.bezierCurveTo(12, 15.4, 16, 11, 16, 7);formaCorazon.bezierCurveTo(16, 7, 16, 0, 10, 0);formaCorazon.bezierCurveTo(7, 0, 5, 5, 5, 5);const geometria = new THREE.ExtrudeGeometry(formaCorazon, { depth: 2, bevelEnabled: true, bevelSize: 0.5, bevelThickness: 0.5 });geometria.center();const material = new THREE.MeshBasicMaterial({ color: 0xff3355 });solCorazon = new THREE.Mesh(geometria, material);solCorazon.scale.set(0.6, 0.6, 0.6);solCorazon.rotation.x = Math.PI;scene.add(solCorazon);}function crearPlanetasRelacion() {const paleta = [0x560bad, 0x3a0ca3, 0x4361ee, 0x4cc9f0, 0xf72585, 0x7209b7, 0xb5179e, 0x480ca8, 0x3f37c9, 0x4895ef];conceptosPlanetas.forEach((nombre, index) => {const radio = Math.random() * 1.5 + 2;const geometria = new THREE.SphereGeometry(radio, 24, 24);const canvasPlaneta = document.createElement('canvas');canvasPlaneta.width = 512;canvasPlaneta.height = 256;const ctx = canvasPlaneta.getContext('2d');const grad = ctx.createLinearGradient(0, 0, 512, 256);grad.addColorStop(0, '#020205');grad.addColorStop(0.5, '#' + paleta[index].toString(16).padStart(6, '0'));grad.addColorStop(1, '#050510');ctx.fillStyle = grad;ctx.fillRect(0, 0, 512, 256);ctx.font = 'bold 38px sans-serif';ctx.textAlign = 'center';ctx.textBaseline = 'middle';ctx.fillStyle = '#ffffff';ctx.fillText(nombre, 256, 128);const material = new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(canvasPlaneta), roughness: 0.5 });const planeta = new THREE.Mesh(geometria, material);const distancia = 35 + (index * 12);const angulo = (index * (Math.PI * 2)) / 10;planeta.position.x = Math.cos(angulo) * distancia;planeta.position.z = Math.sin(angulo) * distancia;planeta.position.y = (Math.random() - 0.5) * 10;planeta.userData = { distancia: distancia, velocidad: 0.003 + (index * 0.0005), angulo: angulo };scene.add(planeta);planetas.push(planeta);});}function crearConstelacionesFrases() {const totalFrases = 100;for (let i = 0; i < totalFrases; i++) {const txt = frases[i % frases.length];const canvasTexto = document.createElement('canvas');const ctx = canvasTexto.getContext('2d');ctx.font = '22px Georgia, serif';const medida = ctx.measureText(txt);canvasTexto.width = medida.width + 20;canvasTexto.height = 40;ctx.font = '22px Georgia, serif';ctx.fillStyle = '#ffea00';ctx.shadowColor = '#ffaa00';ctx.shadowBlur = 4;ctx.textAlign = 'center';ctx.textBaseline = 'middle';ctx.fillText(txt, canvasTexto.width / 2, 20);const material = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvasTexto), transparent: true, blending: THREE.AdditiveBlending });const sprite = new THREE.Sprite(material);const radio = 25 + Math.random() * 120;const al = Math.random() * Math.PI * 2;const be = (Math.random() - 0.5) * Math.PI * 0.3;sprite.position.x = Math.cos(al) * Math.cos(be) * radio;sprite.position.z = Math.sin(al) * Math.cos(be) * radio;sprite.position.y = Math.sin(be) * radio;sprite.scale.set(canvasTexto.width / 40, 1.5, 1);scene.add(sprite);mixFrasesTexto.push(sprite);}}// --- ANIMACIÓN CINEMATOGRÁFICA ---function comenzarExperiencia() {if (enTransicion) return;enTransicion = true;// Arrancar música ambiental de fondobgMusic.play().catch(() => {});// Desvanecer la pantalla de bienvenida de MewwelcomeScreen.style.opacity = '0';setTimeout(() => welcomeScreen.style.display = 'none', 2500);// Transición de cámara helicoidal en espirallet progreso = 0;function cinematica() {progreso += 0.008;const rot = progreso * Math.PI * 3;const rAct = 15 + (115 * progreso);camera.position.x = Math.sin(rot) * rAct;camera.position.z = Math.cos(rot) * rAct;camera.position.y = THREE.MathUtils.lerp(0, 60, progreso);camera.lookAt(0, 0, 0);if (progreso < 1) {requestAnimationFrame(cinematica);} else {camera.position.set(0, 60, 130);controls.enabled = true;uiLayer.style.opacity = '1';}}cinematica();}// --- BUCLE DE ANIMACIÓN CONTINUA ---function animate() {requestAnimationFrame(animate);tiempoGalaxia += 0.001;if (particulasGalaxia) particulasGalaxia.rotation.y = tiempoGalaxia * 1.5;if (solCorazon) {solCorazon.rotation.z = -tiempoGalaxia * 3;const p = 0.6 + Math.sin(tiempoGalaxia * 25) * 0.02;solCorazon.scale.set(p, p, p);}planetas.forEach((p) => {p.userData.angulo += p.userData.velocidad;p.position.x = Math.cos(p.userData.angulo) * p.userData.distancia;p.position.z = Math.sin(p.userData.angulo) * p.userData.distancia;p.rotation.y += 0.01;});controls.update();renderer.render(scene, camera);}function onWindowResize() {camera.aspect = window.innerWidth / window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth, window.innerHeight);}// Inicializar el espacio 3D al cargar completamente la páginawindow.onload = init;
